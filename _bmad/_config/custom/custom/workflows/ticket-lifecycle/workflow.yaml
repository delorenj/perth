# ticket-lifecycle workflow configuration
# Edit these values via the edit mode (steps-e/)

# AC Sufficiency Rubric Criteria
ac_rubric:
  require_non_empty: true
  require_testable_assertions: true
  require_enumerated_items: true
  require_fr_coverage: true

# QA Retry Limits
qa:
  max_retries: 3

# Staleness Detection (durations in minutes)
staleness:
  triage: 10
  refining: 30
  in_progress: 120
  review: 15
  qa: 60

# Bloodbank Event Configuration
# The type is fixed by the Bloodbank naming contract (`bb contract`). Changing
# it requires a name that `bb emit --check --type <name>` accepts, and a
# registered schema under bloodbank/schemas/. There is no `version` field:
# versioning lives in schemaref/dataschema, which bb-emit derives.
events:
  type: "bloodbank.repo.task.updated"
  include_project_id: true
  include_ticket_id: true

# Plane State Mapping
states:
  backlog: "Backlog"
  triage: "Triage"
  refining: "Refining"
  ready: "Ready"
  in_progress: "In Progress"
  review: "Review"
  qa: "QA"
  done: "Done"
  blocked: "Blocked"
