# ticket-lifecycle workflow configuration
# Edit these values via the edit mode (steps-e/)

# AC Sufficiency Rubric Criteria
ac_rubric:
  require_non_empty: true
  require_testable_assertions: true
  require_enumerated_items: true
  require_fr_coverage: true

# QA Retry Limits
qa:
  max_retries: 3

# Staleness Detection (durations in minutes)
staleness:
  triage: 10
  refining: 30
  in_progress: 120
  review: 15
  qa: 60

# Bloodbank
# This workflow publishes NO ticket events, so there is no `events` block.
# Agents never emit bloodbank.repo.task.* / repo.board.*: the Plane webhook
# normalizer (n8n "Plane → Bloodbank") publishes bloodbank.repo.task.updated for
# every state move this workflow writes through px, and repo.task.appended for
# every audit comment. See data/event-schemas.md.

# Plane State Mapping: workflow phase -> board lane, the target of
# `px move {ticket_id} "{states.<phase>}"`. px resolves the lane strictly and
# fails (listing the board's lanes) on a name the board lacks, so these must be
# real lane names. Defaults are the canonical nine lanes (pilot
# schemas/33god-standard.json, a projection of krebs LANES). The canon has no
# triage, review or blocked lane: triage shares Needs Re-evaluation with
# refining, review stays in In Progress until QA, and blocked is the
# human-in-the-loop lane, Needs Attention. The audit comment records the phase.
# A board with other lane names overrides them here.
states:
  backlog: "Backlog"
  triage: "Needs Re-evaluation"
  refining: "Needs Re-evaluation"
  ready: "Todo"
  in_progress: "In Progress"
  review: "In Progress"
  qa: "E2E Testing & QA"
  done: "Done"
  blocked: "Needs Attention"
